<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Page introuvable — La Fée Ménage</title>
  <meta name="robots" content="noindex, nofollow">
  <link rel="stylesheet" href="/assets/css/main.css">
  <link rel="icon" href="/assets/images/logo/fee-favicon.png" type="image/png">
</head>
<body>

  <a href="#main-content" class="skip-link">Aller au contenu principal</a>

  <div data-component="header" style="min-height:72px"></div>

  <main id="main-content">
    <section class="section" style="text-align:center;padding-block:var(--sp-24)">
      <div class="container">
        <p style="font-size:5rem;line-height:1;margin-bottom:var(--sp-6);opacity:0.2">404</p>
        <h1 style="font-size:clamp(1.5rem,4vw,2.5rem);margin-bottom:var(--sp-4)">
          Cette page n'existe pas
        </h1>
        <p class="lead" style="margin-inline:auto;margin-bottom:var(--sp-8)">
          La page que vous recherchez a peut-être été déplacée ou supprimée.
        </p>
        <div style="display:flex;gap:var(--sp-4);justify-content:center;flex-wrap:wrap">
          <a href="/" class="btn btn-primary">Retour à l'accueil</a>
          <a href="/contact/" class="btn btn-secondary">Demander un devis</a>
        </div>
      </div>
    </section>
  </main>

  <div data-component="footer"></div>

  <script src="/assets/js/components.js" defer></script>
  <script src="/assets/js/main.js" defer></script>

</body>
</html>
